apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-v2
  template:
    metadata:
      labels:
        app: inventory-v2
    spec:
      containers:
        - name: inventory-v2
          image: koushick25/inventory-system:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-v2-service
spec:
  type: NodePort
  selector:
    app: inventory-v2
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30002