apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-v1
  template:
    metadata:
      labels:
        app: inventory-v1
    spec:
      containers:
        - name: inventory-v1
          image: koushick25/inventory-system:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-v1-service
spec:
  type: NodePort
  selector:
    app: inventory-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001