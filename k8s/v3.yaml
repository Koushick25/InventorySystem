apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-v3
  template:
    metadata:
      labels:
        app: inventory-v3
    spec:
      containers:
        - name: inventory-v3
          image: koushick25/inventory-system:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-v3-service
spec:
  type: NodePort
  selector:
    app: inventory-v3
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30003